name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Package the tagged version
        run: |
          version="${TAG#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          npm run package -- --out "$RUNNER_TEMP/plastic-scm-$version.vsix"

      - name: Create GitHub release with extension attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/plastic-scm-${TAG#v}.vsix" --clobber
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/plastic-scm-${TAG#v}.vsix" \
            --verify-tag --title "$TAG" --generate-notes

      - name: Publish the same package to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run deploy -- --packagePath "$RUNNER_TEMP/plastic-scm-${TAG#v}.vsix" --skip-duplicate
